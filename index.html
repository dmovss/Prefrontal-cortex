<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>PFC · Тренер</title>
<link id="fav" rel="icon" type="image/png" href="file:///C:/Users/User171/OneDrive/%D0%A0%D0%B0%D0%B1%D0%BE%D1%87%D0%B8%D0%B9%20%D1%81%D1%82%D0%BE%D0%BB/Prefrontal%20cortex/images/icon.png">
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;min-height:100dvh;background:#050505;color:rgba(255,255,255,.88);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Inter,system-ui,sans-serif;
    font-variant-numeric:tabular-nums;overflow-x:hidden}
  body::before{content:"";position:fixed;inset:0;z-index:-2;background:linear-gradient(180deg,#1c1603 0%,#050505 45%)}
  .orb{position:fixed;border-radius:50%;filter:blur(100px);opacity:.35;z-index:-1;animation:drift 26s ease-in-out infinite}
  .o1{width:60vmax;height:60vmax;background:#ca8a04;top:-22vmax;left:-16vmax}
  .o2{width:46vmax;height:46vmax;background:#f59e0b;bottom:-16vmax;right:-14vmax;opacity:.22;animation-duration:33s}
  .o3{width:30vmax;height:30vmax;background:#854d0e;top:42vh;left:55vw;opacity:.25;animation-duration:22s}
  @keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(8vw,6vh)}}

  .app{max-width:480px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;gap:16px;
    padding:calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 24px)}

  .glass{position:relative;border-radius:28px;padding:20px;
    background:linear-gradient(155deg,rgba(250,204,21,.16),rgba(255,255,255,.02) 60%);
    -webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.22),inset 0 -1px 0 rgba(255,255,255,.04),0 30px 80px -30px rgba(0,0,0,.9)}
  .glass::before{content:"";position:absolute;inset:0;border-radius:inherit;padding:1px;pointer-events:none;
    background:linear-gradient(135deg,rgba(253,224,71,.75),rgba(253,224,71,.08) 45%,transparent);
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;
    mask:linear-gradient(#000 0 0) content-box exclude,linear-gradient(#000 0 0)}

  .row{display:flex;align-items:center;justify-content:space-between;gap:12px}
  .kicker{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#fde047;font-weight:600}
  .ttl{font-size:20px;font-weight:650;letter-spacing:-.02em;color:#fff;margin-top:2px}
  h1{font-size:34px;line-height:1.08;letter-spacing:-.02em;margin:0;color:#fff;font-weight:700}
  h2{font-size:24px;letter-spacing:-.01em;margin:0;color:#fff;font-weight:650}
  p{margin:0;font-size:16px;line-height:1.55;color:rgba(255,255,255,.75)}
  .sub{font-size:15px;color:rgba(255,255,255,.6);min-height:20px;text-align:center}
  .big-num{font-size:44px;font-weight:750;color:#fff;letter-spacing:-.02em;line-height:1}

  .btn{appearance:none;border:0;cursor:pointer;font-family:inherit;font-size:17px;font-weight:600;color:#fff;
    padding:16px 22px;border-radius:999px;background:rgba(255,255,255,.08);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 10px 30px -12px rgba(0,0,0,.9);
    transition:transform .2s cubic-bezier(.4,0,.2,1),filter .2s}
  .btn:active{transform:scale(.97);filter:brightness(1.15)}
  .btn:disabled{opacity:.35;pointer-events:none}
  .btn-y{background:linear-gradient(120deg,#fef08a,#facc15 45%,#f59e0b);color:#000;font-weight:700;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 0 40px -10px rgba(250,204,21,.6)}
  .btn-small{padding:10px 16px;font-size:14px}
  .btn-block{width:100%}
  .btn-big{padding:22px;font-size:20px}

  .card{display:flex;align-items:center;gap:14px;width:100%;text-align:left;cursor:pointer;color:inherit;font-family:inherit}
  .num-badge{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;
    background:rgba(250,204,21,.14);color:#fde047;font-weight:750;font-size:18px}
  .done{background:linear-gradient(135deg,#fde047,#f59e0b);color:#000}
  .meta{font-size:13px;color:rgba(253,224,71,.85);letter-spacing:.04em}

  .screen{display:none;flex-direction:column;gap:16px}
  .screen.on{display:flex;animation:up .5s cubic-bezier(.4,0,.2,1)}
  @keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}

  .timer-bar{height:10px;border-radius:999px;background:rgba(255,255,255,.08);overflow:hidden}
  .timer-fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#facc15,#f59e0b);
    box-shadow:0 0 18px -2px rgba(250,204,21,.7);transition:width .15s linear}

  .stage{display:flex;flex-direction:column;align-items:center;gap:18px;min-height:360px;justify-content:center}
  .word{font-size:72px;font-weight:800;letter-spacing:-.02em;min-height:90px;display:grid;place-items:center;text-align:center}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;width:100%;max-width:320px}
  .sbtn{appearance:none;border:0;border-radius:24px;padding:24px 0;font:800 20px inherit;color:#000;cursor:pointer;font-family:inherit;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 14px 30px -14px rgba(0,0,0,.9);transition:transform .15s}
  .sbtn:active{transform:scale(.96)}
  .cell{aspect-ratio:1;border-radius:22px;background:rgba(255,255,255,.06);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.15),0 10px 24px -14px rgba(0,0,0,.9);transition:all .25s}
  .cell.on{background:radial-gradient(circle at 35% 30%,#fef9c3,#facc15 55%,#b45309);
    box-shadow:0 0 50px -4px rgba(250,204,21,.8),inset 0 1px 0 rgba(255,255,255,.5)}

  .orb-box{position:relative;width:min(70vw,280px);aspect-ratio:1;margin:0 auto}
  .orb{position:absolute;inset:18%;border-radius:50%;z-index:1;
    background:radial-gradient(circle at 35% 30%,#fef9c3,#facc15 40%,#b45309 85%);
    box-shadow:0 0 70px -8px rgba(250,204,21,.7),inset 0 1px 0 rgba(255,255,255,.5);transform:scale(.55)}
  .ring{position:absolute;inset:0;border-radius:50%;border:1px solid rgba(253,224,71,.25)}
  .orb-txt{position:absolute;inset:0;display:grid;place-items:center;z-index:2;font-size:24px;font-weight:700;color:#000;pointer-events:none}

  .ring-svg{transform:rotate(-90deg)}
  .ring-prog{transition:stroke-dashoffset .8s cubic-bezier(.4,0,.2,1)}
  .metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .metric{padding:16px}
  .metric .lbl{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#fde047;font-weight:600}
  .metric .val{font-size:30px;font-weight:700;color:#fff;margin-top:4px}

  .toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 24px);transform:translateX(-50%);
    padding:12px 20px;border-radius:999px;background:rgba(20,16,4,.9);color:#fde047;font-size:15px;font-weight:600;
    opacity:0;transition:opacity .3s;pointer-events:none;border:1px solid rgba(250,204,21,.3);z-index:9}
  .toast.show{opacity:1}
</style>
</head>
<body>
<div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>

<div class="app">
  <header class="row">
    <div>
      <div class="kicker">PFC · Тренер</div>
      <div class="ttl" id="ttl">Тренировка</div>
    </div>
    <button class="btn btn-small" id="snd">Звук: вкл</button>
  </header>

  <!-- ГЛАВНАЯ -->
  <section class="screen" id="home">
    <div class="glass">
      <h1>Тренировка <span style="color:#facc15">внимания</span> и контроля</h1>
      <p style="margin-top:12px">4 упражнения по 30 секунд. Каждое тренирует отдельную функцию префронтальной коры.</p>
    </div>
    <div id="mods" style="display:flex;flex-direction:column;gap:12px"></div>
    <button class="btn btn-y btn-block btn-big" id="go">Начать тренировку</button>
    <div class="sub" id="last"></div>
  </section>

  <!-- ИГРА -->
  <section class="screen" id="game">
    <div class="glass">
      <div class="row">
        <div>
          <div class="meta" id="gStep">Шаг 1 из 4</div>
          <h2 id="gName" style="margin-top:4px">—</h2>
        </div>
        <div class="big-num" id="gTime">30</div>
      </div>
      <div class="timer-bar" style="margin-top:16px"><div class="timer-fill" id="gBar"></div></div>
      <p class="sub" id="gDesc" style="margin-top:12px;min-height:0;font-size:15px"></p>
    </div>
    <div class="glass stage" id="stage"></div>
    <button class="btn btn-y btn-block btn-big" id="startBtn">Старт</button>
    <button class="btn btn-block" id="quit">Выйти</button>
  </section>

  <!-- РЕЗУЛЬТАТ -->
  <section class="screen" id="result">
    <div class="glass" style="display:flex;align-items:center;gap:20px">
      <svg width="120" height="120" viewBox="0 0 120 120" class="ring-svg" style="flex-shrink:0">
        <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%" stop-color="#fef08a"/><stop offset="100%" stop-color="#f59e0b"/></linearGradient></defs>
        <circle cx="60" cy="60" r="50" fill="none" stroke="rgba(255,255,255,.08)" stroke-width="10"/>
        <circle id="ringP" cx="60" cy="60" r="50" fill="none" stroke="url(#rg)" stroke-width="10" stroke-linecap="round"
          stroke-dasharray="314.16" stroke-dashoffset="314.16" class="ring-prog"/>
        <text id="ringT" x="60" y="70" text-anchor="middle" transform="rotate(90 60 60)" font-size="32" font-weight="750" fill="#fff">0</text>
      </svg>
      <div>
        <div class="kicker">Индекс готовности</div>
        <h2 id="resLbl" style="margin-top:6px">—</h2>
      </div>
    </div>
    <div class="metrics" id="metrics"></div>
    <button class="btn btn-y btn-block btn-big" id="again">Пройти снова</button>
    <button class="btn btn-block" id="home2">На главную</button>
  </section>
</div>

<div class="toast" id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const rnd = n => Math.floor(Math.random() * n);
const rndInt = (a, b) => a + rnd(b - a + 1);

/* ---------- favicon с запасными путями ---------- */
(function favicon(){
  const fav = $('#fav');
  const cands = [fav.getAttribute('href'), 'images/icon.png', 'icon.png'];
  const tryIcon = i => {
    if (i >= cands.length) return;
    const p = new Image();
    p.onload = () => fav.href = cands[i];
    p.onerror = () => tryIcon(i + 1);
    p.src = cands[i];
  };
  tryIcon(0);
})();

/* ---------- звук ---------- */
let sndOn = true, AC = null;
function beep(f, d = 0.15) {
  if (!sndOn) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const o = AC.createOscillator(), g = AC.createGain();
    o.frequency.value = f;
    g.gain.setValueAtTime(0.08, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime + d);
    o.connect(g).connect(AC.destination);
    o.start(); o.stop(AC.currentTime + d);
  } catch (e) {}
}
$('#snd').onclick = () => {
  sndOn = !sndOn;
  $('#snd').textContent = 'Звук: ' + (sndOn ? 'вкл' : 'выкл');
  beep(660);
};

/* ---------- таймер ---------- */
function clock(sec, onTick, onEnd) {
  const t0 = performance.now(); let raf;
  const loop = t => {
    const left = Math.max(0, sec - (t - t0) / 1000);
    onTick(left);
    if (left <= 0) { onEnd(); return; }
    raf = requestAnimationFrame(loop);
  };
  raf = requestAnimationFrame(loop);
  return () => cancelAnimationFrame(raf);
}

function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 1400);
}

/* ---------- экраны ---------- */
const TITLES = { home: 'Тренировка', game: 'Упражнение', result: 'Результат' };
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.toggle('on', s.id === id));
  $('#ttl').textContent = TITLES[id];
  window.scrollTo(0, 0);
}

/* ---------- модули ---------- */
const MODS = [
  { id: 'breath', name: 'Дыхание и внимание', time: 30,
    desc: 'Дышите вместе с кругом. Если отвлеклись — нажмите «Я отвлёкся».' },
  { id: 'stroop', name: 'Цвет против слова', time: 30,
    desc: 'Нажмите цвет, которым напечатано слово. Само слово игнорируйте.' },
  { id: 'nback', name: 'Память на позицию', time: 30,
    desc: 'Нажмите «Совпало», если квадрат сейчас стоит на том же месте, что и на прошлом шаге.' },
  { id: 'switch', name: 'Смена правила', time: 30,
    desc: 'Читайте правило вверху. Для чисел — чётное или нечётное, для букв — гласная или согласная.' },
];

const M = {};

/* 1. Дыхание */
const B = { on: false, drifts: 0, timers: [] };
M.breath = {
  render(el) {
    el.innerHTML = `
      <div class="orb-box">
        <div class="ring"></div>
        <div class="orb" id="orb"></div>
        <div class="orb-txt" id="ot" style="color:#fde047;mix-blend-mode:normal"></div>
      </div>
      <button class="btn btn-y btn-block" id="wander">Я отвлёкся</button>
      <div class="sub" id="note">Отвлечения: 0</div>`;
    $('#ot').textContent = 'Готовы?';
    $('#wander').onclick = () => {
      if (!B.on) return;
      B.drifts++;
      $('#note').textContent = 'Заметили. Возвращаемся к дыханию. Отвлечения: ' + B.drifts;
      beep(440, 0.15);
    };
  },
  start() {
    B.on = true; B.drifts = 0;
    const P = [['Вдох', 4, 1], ['Пауза', 4, 1], ['Выдох', 6, 0.55], ['Пауза', 2, 0.55]];
    let i = 0;
    const run = () => {
      const [t, d, s] = P[i++ % 4];
      const o = $('#orb');
      o.style.transition = `transform ${d}s cubic-bezier(.4,0,.2,1)`;
      o.style.transform = `scale(${s})`;
      $('#ot').textContent = t;
      B.timers.push(setTimeout(run, d * 1000));
    };
    run();
  },
  stop() {
    B.on = false; B.timers.forEach(clearTimeout); B.timers = [];
    return Math.max(0, 100 - B.drifts * 20);
  },
};

/* 2. Струп */
const SC = [
  { n: 'КРАСНЫЙ', c: '#ef4444' }, { n: 'СИНИЙ', c: '#3b82f6' },
  { n: 'ЗЕЛЁНЫЙ', c: '#22c55e' }, { n: 'ЖЁЛТЫЙ', c: '#facc15' },
];
const S = { on: false, w: 0, ink: 0, ok: 0, tot: 0 };
function sNext() {
  const w = rnd(4);
  let k = rnd(4);
  if (Math.random() < 0.75) while (k === w) k = rnd(4);
  S.w = w; S.ink = k;
  const e = $('#sw');
  e.textContent = SC[w].n;
  e.style.color = SC[k].c;
  e.style.textShadow = `0 0 30px ${SC[k].c}88`;
  $('#sc').textContent = `Верно ${S.ok} из ${S.tot}`;
}
function sAnswer(i) {
  if (!S.on) return;
  S.tot++;
  const good = i === S.ink;
  if (good) S.ok++;
  beep(good ? 880 : 200, 0.12);
  sNext();
}
M.stroop = {
  render(el) {
    el.innerHTML = `
      <div class="word" id="sw">—</div>
      <div class="sub" id="sc"></div>
      <div class="grid2">${SC.map((c, i) => `<button class="sbtn" data-i="${i}" style="background:${c.c}">${c.n}</button>`).join('')}</div>`;
    el.querySelectorAll('.sbtn').forEach(b => b.onclick = () => sAnswer(+b.dataset.i));
  },
  start() { S.on = true; S.ok = 0; S.tot = 0; sNext(); },
  stop() { S.on = false; return S.tot ? Math.round(S.ok / S.tot * 100) : 0; },
};

/* 3. N-back (N=1) */
const NB = { on: false, seq: [], resp: [], i: -1, last: -1, ok: 0, ev: 0, t: null };
function nbEval(k) {
  if (k < 1 || k === NB.last) return;
  NB.last = k;
  const match = NB.seq[k] === NB.seq[k - 1];
  const said = !!NB.resp[k];
  NB.ev++;
  if (match === said) NB.ok++;
}
function nbStep() {
  nbEval(NB.i);
  NB.i++;
  if (NB.i >= NB.seq.length) { M.nback.stop(); finishStep(); return; }
  const cells = document.querySelectorAll('#nbg .cell');
  cells.forEach(c => c.classList.remove('on'));
  cells[NB.seq[NB.i]].classList.add('on');
  $('#nbs').textContent = `Шаг ${NB.i + 1}`;
  NB.t = setTimeout(nbStep, 2000);
}
M.nback = {
  render(el) {
    el.innerHTML = `
      <div class="grid3" id="nbg">${Array.from({ length: 9 }, () => '<div class="cell"></div>').join('')}</div>
      <div class="sub" id="nbs">Запоминайте позицию</div>
      <button class="btn btn-y btn-block btn-big" id="nbm">Совпало</button>`;
    $('#nbm').onclick = () => { if (NB.on && NB.i >= 0) NB.resp[NB.i] = true; };
  },
  start() {
    NB.on = true; NB.seq = []; NB.resp = []; NB.i = -1; NB.last = -1; NB.ok = 0; NB.ev = 0;
    for (let k = 0; k < 20; k++) {
      if (k > 0 && Math.random() < 0.3) NB.seq.push(NB.seq[k - 1]);
      else { let p; do p = rnd(9); while (k > 0 && p === NB.seq[k - 1]); NB.seq.push(p); }
    }
    nbStep();
  },
  stop() {
    NB.on = false; clearTimeout(NB.t);
    nbEval(NB.i);
    return NB.ev ? Math.round(NB.ok / NB.ev * 100) : 0;
  },
};

/* 4. Переключение правил */
const TS = { on: false, rule: 'num', left: 0, exp: 0, t0: 0, ok: 0, tot: 0 };
const NUMS = [1, 2, 3, 4, 5, 6, 7, 8, 9];
const VOW = ['А', 'Е', 'И', 'О', 'У', 'Ы', 'Э', 'Ю', 'Я'];
const CON = ['Б', 'В', 'Г', 'Д', 'К', 'М', 'Н', 'П', 'Р', 'С', 'Т'];
function tsNext() {
  if (TS.left <= 0) { TS.rule = TS.rule === 'num' ? 'let' : 'num'; TS.left = rndInt(3, 5); }
  TS.left--;
  const isNum = TS.rule === 'num';
  const pool = isNum ? NUMS : VOW.concat(CON);
  const v = pool[rnd(pool.length)];
  TS.exp = isNum ? (v % 2 === 0 ? 0 : 1) : (VOW.includes(v) ? 0 : 1);
  $('#rule').textContent = isNum ? 'ПРАВИЛО: ЧИСЛО' : 'ПРАВИЛО: БУКВА';
  $('#rule').style.color = isNum ? '#fde047' : '#fbbf24';
  $('#tsw').textContent = v;
  $('#tss').textContent = `Верно ${TS.ok} из ${TS.tot}`;
  const opts = isNum ? ['ЧЁТНОЕ', 'НЕЧЁТНОЕ'] : ['ГЛАСНАЯ', 'СОГЛАСНАЯ'];
  const box = $('#tsb');
  box.innerHTML = opts.map((o, i) => `<button class="btn btn-big" data-i="${i}">${o}</button>`).join('');
  box.querySelectorAll('button').forEach(b => b.onclick = () => tsAnswer(+b.dataset.i));
  TS.t0 = performance.now();
}
function tsAnswer(i) {
  if (!TS.on) return;
  TS.tot++;
  const good = i === TS.exp;
  if (good) TS.ok++;
  beep(good ? 880 : 200, 0.12);
  tsNext();
}
M.switch = {
  render(el) {
    el.innerHTML = `
      <div class="meta" id="rule" style="font-size:15px;font-weight:700;letter-spacing:.12em">—</div>
      <div class="word" id="tsw" style="font-size:96px">—</div>
      <div class="sub" id="tss"></div>
      <div class="grid2" id="tsb"></div>`;
  },
  start() { TS.on = true; TS.ok = 0; TS.tot = 0; TS.rule = Math.random() < 0.5 ? 'num' : 'let'; TS.left = rndInt(3, 5); tsNext(); },
  stop() { TS.on = false; return TS.tot ? Math.round(TS.ok / TS.tot * 100) : 0; },
};

/* ---------- ход тренировки ---------- */
let step = 0, scores = [], stopClock = null, running = false, lastIdx = null;

function openStep(i) {
  step = i;
  const m = MODS[i];
  const el = $('#stage');
  el.innerHTML = '';
  M[m.id].render(el);
  $('#gStep').textContent = `Шаг ${i + 1} из 4`;
  $('#gName').textContent = m.name;
  $('#gDesc').textContent = m.desc;
  $('#gTime').textContent = m.time;
  $('#gBar').style.width = '0%';
  $('#startBtn').hidden = false;
  show('game');
}

function startStep() {
  const m = MODS[step];
  running = true;
  $('#startBtn').hidden = true;
  M[m.id].start();
  stopClock = clock(m.time,
    left => {
      $('#gTime').textContent = Math.ceil(left);
      $('#gBar').style.width = ((m.time - left) / m.time * 100) + '%';
    },
    () => finishStep());
}

function finishStep() {
  if (!running) return;
  running = false;
  stopClock && stopClock();
  scores[step] = M[MODS[step].id].stop();
  beep(990, 0.25);
  if (step < 3) openStep(step + 1);
  else showResult();
}

function abort() {
  if (!running) return;
  running = false;
  stopClock && stopClock();
  M[MODS[step].id].stop();
}

function showResult() {
  const [b, s, n, t] = scores;
  const idx = Math.round((b + s + n + t) / 4);
  lastIdx = idx;
  $('#ringP').style.strokeDashoffset = String(314.16 * (1 - idx / 100));
  $('#ringT').textContent = idx;
  $('#resLbl').textContent = idx >= 80 ? 'Высокая готовность' : idx >= 60 ? 'Хорошая форма' : idx >= 40 ? 'Развивается' : 'Начальный уровень';
  $('#metrics').innerHTML = [
    ['Внимание', b], ['Торможение', s], ['Память', n], ['Переключение', t],
  ].map(([l, v]) => `<div class="glass metric"><div class="lbl">${l}</div><div class="val">${v}%</div></div>`).join('');
  show('result');
  beep(1046, 0.4);
}

/* ---------- главная ---------- */
function renderHome() {
  $('#mods').innerHTML = MODS.map((m, i) => `
    <div class="glass">
      <div class="card" data-i="${i}" role="button" tabindex="0">
        <div class="num-badge">${i + 1}</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:17px;font-weight:650;color:#fff">${m.name}</div>
          <div class="meta" style="margin-top:4px">30 сек</div>
        </div>
      </div>
    </div>`).join('');
  document.querySelectorAll('#mods .card').forEach(c => c.onclick = () => { openStep(+c.dataset.i); });
  $('#last').textContent = lastIdx == null ? '' : `Последний индекс: ${lastIdx}`;
}

$('#go').onclick = () => { scores = []; openStep(0); };
$('#startBtn').onclick = () => { beep(660, 0.1); startStep(); };
$('#quit').onclick = () => { abort(); renderHome(); show('home'); };
$('#again').onclick = () => { scores = []; openStep(0); };
$('#home2').onclick = () => { renderHome(); show('home'); };

renderHome();
show('home');
</script>
</body>
</html>
